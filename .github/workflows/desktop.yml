name: Desktop app

on:
  push:
    branches: [main]
    paths-ignore:
      - "ios/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Build and publish macOS app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build universal app
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Collect dmg
        run: |
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg" || { echo "no dmg produced"; exit 1; }
          cp "$dmg" Andrews-mac.dmg
          ls -la Andrews-mac.dmg

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Built automatically from the newest code on `main`.

          **Install**
          1. Open `Andrews-mac.dmg` and drag Andrew's into Applications.
          2. On first launch macOS may say the app is from an unidentified developer. Open System Settings, go to Privacy & Security, scroll down, and click Open Anyway next to Andrew's. This only happens once.
          3. Sign in with any email. The promo code `CYCLONE10` takes 10% off.
          NOTES

          git tag -f latest
          git push -f origin latest

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Andrew's (latest build)" --notes-file notes.md
          fi
          gh release upload latest Andrews-mac.dmg --clobber
          gh release edit latest --latest --notes-file notes.md
